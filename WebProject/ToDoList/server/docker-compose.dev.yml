version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todolist
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - todolist-dev-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: todolist-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: dev_user
      DB_PASSWORD: dev_password
      DB_DATABASE: todolist
      DB_SYNCHRONIZE: true
      DB_LOGGING: true
      DB_POOL_SIZE: 10
      DB_MAX_QUERY_TIME: 1000
      JWT_SECRET: dev-jwt-secret-key
      JWT_EXPIRES_IN: 24h
      LOG_LEVEL: debug
      LOG_MAX_SIZE: 20m
      LOG_MAX_FILES: 14d
    depends_on:
      - mysql
    networks:
      - todolist-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - app_dev_logs:/app/logs
    command: sh -c "corepack enable pnpm && pnpm install && pnpm run start:dev"

volumes:
  mysql_dev_data:
  app_dev_logs:

networks:
  todolist-dev-network:
    driver: bridge
