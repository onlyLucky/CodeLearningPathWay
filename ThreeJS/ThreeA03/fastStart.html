<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 基础场景 - 完整示例</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
        button {
            display: block;
            margin-bottom: 10px;
            padding: 8px 15px;
            background: #0073e6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #005bb5; }
    </style>
    <!-- 引入 Three.js 核心库及常用插件 -->
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/three.js/r161/three.min.js "></script>
    <!-- 用于加载GLTF/GLB格式模型 -->
    <script src=" https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.min.js "></script>
    <!-- 用于加载OBJ格式模型 -->
    <script src=" https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/OBJLoader.min.js "></script>
    <!-- 轨道控制器，用于鼠标控制场景 -->
    <script src=" https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.min.js "></script>
    <!-- 性能监控器 -->
    <script src=" https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/libs/stats.min.js "></script>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <div>基于 Three.js r161 构建</div>
        <div id="stats">FPS: -- | Triangles: --</div>
    </div>
    <div id="controls">
        <button id="uploadBtn">上传模型 (OBJ/GLTF)</button>
        <button id="rotatingBtn">开始/停止旋转</button>
        <button id="addCubeBtn">添加立方体</button>
    </div>

    <script>
        //===========【1. 基础设置】===========
        // 获取容器
        const container = document.getElementById('container');
        // 创建场景
        const scene = new THREE.Scene();
        // 设置背景色为浅灰色
        scene.background = new THREE.Color(0xf0f0f0);

        // 创建透视相机（模拟人眼视角）
        const camera = new THREE.PerspectiveCamera(
            75, // 视野角度（FOV）
            window.innerWidth / window.innerHeight, // 宽高比
            0.1, // 近剪切面
            1000 // 远剪切面
        );
        camera.position.set(5, 5, 5); // 设置相机位置 (x, y, z)
        camera.lookAt(0, 0, 0); // 让相机看向场景中心

        // 创建 WebGL 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true }); // 开启抗锯齿
        renderer.setSize(window.innerWidth, window.innerHeight); // 设置渲染尺寸
        container.appendChild(renderer.domElement); // 将canvas插入容器

        // 启用阴影
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // 创建轨道控制器（鼠标控制）
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 启用阻尼效果，使操作更平滑
        controls.dampingFactor = 0.05;

        // 创建性能监视器
        const stats = new Stats();
        stats.showPanel(0); // 0: fps, 1: ms, 2: mb
        document.getElementById('info').appendChild(stats.dom);

        // 光线投射器（用于鼠标拾取）
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        //===========【2. 添加基础物体和光源】===========
        // 创建几何体、材质、网格对象
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00aaff,
            roughness: 0.4,
            metalness: 0.6
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.castShadow = true; // 物体投射阴影
        cube.receiveShadow = true; // 物体接收阴影
        scene.add(cube);

        // 添加一个平面作为地面
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xcccccc,
            roughness: 0.8,
            metalness: 0.2
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2; // 旋转90度，使其水平
        plane.position.y = -1;
        plane.receiveShadow = true;
        scene.add(plane);

        // 添加环境光（基础照明）
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // 添加方向光（产生阴影的主要光源）
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        // 优化阴影设置
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // 添加网格辅助线
        const gridHelper = new THREE.GridHelper(10, 10, 0x000000, 0x888888);
        scene.add(gridHelper);

        // 添加坐标轴辅助线（红色-X，绿色-Y，蓝色-Z）
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        //===========【3. 动画循环与状态变量】===========
        let isRotating = false;
        let rotationSpeed = 0.005;

        function animate() {
            stats.begin(); // 开始性能统计

            if (isRotating) {
                // 旋转场景中所有物体
                scene.children.forEach(object => {
                    if (object.isMesh && object !== plane && object !== gridHelper && object !== axesHelper) {
                        object.rotation.y += rotationSpeed;
                        object.rotation.x += rotationSpeed * 0.3;
                    }
                });
            }

            controls.update(); // 更新轨道控制器
            renderer.render(scene, camera); // 渲染场景

            // 更新性能显示
            document.getElementById('stats').innerHTML = 
                `FPS: ${Math.round(stats.fps)} | Triangles: ${renderer.info.render.triangles}`;

            stats.end(); // 结束性能统计

            requestAnimationFrame(animate); // 循环调用
        }
        animate(); // 启动动画循环

        //===========【4. 用户交互与事件处理】===========
        // 【4.1】 上传模型
        document.getElementById('uploadBtn').addEventListener('click', () => {
            // 创建隐藏的文件输入元素
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.obj,.gltf,.glb';
            
            input.onchange = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    
                    // 根据文件扩展名选择加载器
                    const extension = file.name.split('.').pop().toLowerCase();
                    
                    if (extension === 'obj') {
                        // 使用 OBJLoader 加载 .obj 文件
                        const loader = new THREE.OBJLoader();
                        const objData = loader.parse(arrayBuffer);
                        objData.traverse(child => {
                            if (child.isMesh) {
                                child.material = new THREE.MeshStandardMaterial({ color: 0x88ff88 });
                                child.castShadow = true;
                            }
                        });
                        objData.position.set(0, 0, 0);
                        scene.add(objData);
                        
                    } else if (extension === 'gltf' || extension === 'glb') {
                        // 使用 GLTFLoader 加载 .gltf/.glb 文件
                        const loader = new THREE.GLTFLoader();
                        const data = extension === 'glb' ? arrayBuffer : new TextDecoder().decode(arrayBuffer);
                        
                        loader.parse(data, '', (gltf) => {
                            gltf.scene.traverse(child => {
                                if (child.isMesh) {
                                    child.castShadow = true;
                                }
                            });
                            scene.add(gltf.scene);
                        });
                    }
                };
                
                if (file.name.endsWith('.glb')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file);
                }
            };
            
            input.click(); // 触发文件选择对话框
        });

        // 【4.2】 旋转控制
        document.getElementById('rotatingBtn').addEventListener('click', () => {
            isRotating = !isRotating;
            document.getElementById('rotatingBtn').textContent = 
                isRotating ? '停止旋转' : '开始旋转';
        });

        // 【4.3】 添加立方体
        document.getElementById('addCubeBtn').addEventListener('click', () => {
            const size = Math.random() * 0.5 + 0.3;
            const cubeGeometry = new THREE.BoxGeometry(size, size, size);
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            const cubeMaterial = new THREE.MeshStandardMaterial({ 
                color: colors[Math.floor(Math.random() * colors.length)],
                roughness: Math.random() * 0.5 + 0.3
            });
            const newCube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            
            // 随机位置
            newCube.position.set(
                (Math.random() - 0.5) * 4,
                (Math.random() - 0.5) * 2 + 1,
                (Math.random() - 0.5) * 4
            );
            
            newCube.castShadow = true;
            scene.add(newCube);
        });

        // 【4.4】 鼠标点击拾取物体
        window.addEventListener('click', (event) => {
            // 将鼠标位置归一化为 -1 到 +1 的坐标
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // 通过相机和鼠标位置更新射线
            raycaster.setFromCamera(mouse, camera);
            
            // 计算射线与哪些物体相交
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                // 点击到的第一个物体
                const clickedObject = intersects[0].object;
                
                // 临时改变颜色作为反馈
                const originalColor = clickedObject.material.color.getHex();
                clickedObject.material.color.set(0xffff00);
                
                // 1秒后恢复原始颜色
                setTimeout(() => {
                    clickedObject.material.color.set(originalColor);
                }, 1000);
                
                console.log('点击了物体:', clickedObject);
            }
        });

        // 【4.5】 窗口大小变化响应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        //===========【5. 提示信息】===========
        console.log('Three.js 基础场景已加载完成！');
        console.log('使用说明:');
        console.log('1. 鼠标左键拖拽 - 旋转场景');
        console.log('2. 鼠标右键拖拽 - 平移场景');
        console.log('3. 鼠标滚轮 - 缩放场景');
        console.log('4. 点击物体可选中并高亮显示');
    </script>
</body>
</html>
