<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>responsive-editor</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-size: 16px;
    }
    #editor {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #controls {
      background: #AAA;
      padding: 5px;
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
    .gutter {
      background-color: #eee;
      background-repeat: no-repeat;
      background-position: 50%;
    }
    .gutter.gutter-horizontal {
      cursor: ew-resize;
      background-image:  url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAeCAYAAADkftS9AAAAIklEQVQoU2M4c+bMfxAGAgYYmwGrIIiDjrELjpo5aiZeMwF+yNnOs5KSvgAAAABJRU5ErkJggg==')
    }
  </style>
</head>
<body>
  <div id="editor">
    <div id="view"><canvas id="c"></canvas></div>
    <div id="controls">
      <div>
        <p>various controls
            would appear here</p>
          <div>Drag this bar</div>
          <div>⇐</div>
      </div>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/libs/three_r134/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="../../assets/libs/01/threejs-responsive.js"></script>
  <script src="../../assets/libs/split.min.js"></script>
  <script>
    Split(['#view', '#controls' ], {
      sizes: [ 75, 25 ],
      minSize: 100,
      elementStyle: ( dimension, size, gutterSize ) => {
        return {
          'flex-basis': `calc(${size}% - ${gutterSize}px)`,
        };
      },
      gutterStyle: ( dimension, gutterSize ) => {
        return {
          'flex-basis': `${gutterSize}px`,
        };
      },
    });
  </script>
</body>
</html>
