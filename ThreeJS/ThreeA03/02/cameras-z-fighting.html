<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perspective Camera</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/libs/three0.182.0/three.module.min.js",
        "three/addons/": "../../assets/libs/three0.182.0/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; // 引入视图控制器
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    function main(){
      const canvas = document.querySelector( '#c' );
      const renderer = new THREE.WebGLRenderer({
        antialias:true,
        canvas,
        logarithmicDepthBuffer: true,// 开启对数深度缓冲区，解决 Z 冲突问题
      });

      const fov = 45;
      const aspect = 2; // the canvas default
      const near = 0.00001;
      const far = 100;
      // PerspectiveCamera 透视相机 可以提供一个近大远小的3D视觉效果。
      const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
      camera.position.set(10, 6, 10);

      // 用于在 GUI 中联动控制最小值/最大值的辅助类
      class MinMaxGUIHelper {
        constructor(obj, minProp, maxProp, minDif) {
          this.obj = obj;        // 被代理的对象
          this.minProp = minProp; // 最小值属性名
          this.maxProp = maxProp; // 最大值属性名
          this.minDif = minDif;   // 最小间隔，保证 max ≥ min + minDif
        }
        get min() {
          return this.obj[this.minProp];
        }
        set min(v) {
          this.obj[this.minProp] = v;
          // 自动调整 max，确保不小于 min + minDif
          this.obj[this.maxProp] = Math.max(this.obj[this.maxProp], v + this.minDif);
        }
        get max() {
          return this.obj[this.maxProp];
        }
        set max(v) {
          this.obj[this.maxProp] = v;
          this.min = this.min;  // 触发 min 的 setter，保持约束
        }
      }

      // 更新相机投影矩阵，使参数改动立即生效
      function updateCamera() {
        camera.updateProjectionMatrix();
      }

      // 创建 GUI 面板并添加相机参数控制
      const gui = new GUI();
      gui.add(camera, 'fov', 1, 180).onChange(updateCamera); // 视野角度
      const minMaxGUIHelper = new MinMaxGUIHelper(camera, 'near', 'far', 0.1);
      gui.add(minMaxGUIHelper, 'min', 0.1, 50, 0.1).name('near').onChange(updateCamera);
      gui.add(minMaxGUIHelper, 'max', 0.1, 50, 0.1).name('far').onChange(updateCamera);

      // 创建轨道控制器，允许用户通过鼠标拖拽、滚轮缩放等方式交互浏览场景
      const controls = new OrbitControls( camera, canvas );
      // 设置控制器焦点为(0,5,0)，即相机环绕的中心点
      controls.target.set( 0, 5, 0 );
      // 应用控制器参数更新
      controls.update();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color( 'black' );

      {
        // 定义地面尺寸
        const planeSize = 40;
 
        // 创建纹理加载器并加载棋盘格纹理
        const loader = new THREE.TextureLoader();
        const texture = loader.load('../../assets/statics/images/checker.png');
        // 设置纹理在 S 方向（水平）重复
        texture.wrapS = THREE.RepeatWrapping;
        // 设置纹理在 T 方向（垂直）重复
        texture.wrapT = THREE.RepeatWrapping;
        // 使用最近邻过滤，避免纹理放大时模糊
        texture.magFilter = THREE.NearestFilter;
        // 设置纹理颜色空间为 sRGB
        texture.colorSpace = THREE.SRGBColorSpace;
        // 计算纹理重复次数，使每个格子大小为 2 单位
        const repeats = planeSize / 2;
        texture.repeat.set(repeats, repeats);

        // 创建平面几何体
        const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
        // 创建带纹理的 Phong 材质，双面渲染
        const planeMat = new THREE.MeshPhongMaterial({
          map: texture,
          side: THREE.DoubleSide,
        });
        // 创建地面网格
        const mesh = new THREE.Mesh(planeGeo, planeMat);
        // 将平面旋转至水平（绕 X 轴旋转 -90 度）
        mesh.rotation.x = Math.PI * -.5;
        // 将地面添加到场景
        scene.add(mesh);
      }

      /* z冲突 GPU没有足够的精度来决定哪个像素在前哪个在后 */
      {
        const sphereRadius = 3;
        const sphereWidthDivisions = 32;
        const sphereHeightDivisions = 16;
        const sphereGeo = new THREE.SphereGeometry(sphereRadius, sphereWidthDivisions, sphereHeightDivisions);
        const numSpheres = 20;
        for (let i = 0; i < numSpheres; i++) {
          const sphereMat = new THREE.MeshPhongMaterial();
          sphereMat.color.setHSL(i*.73, 1, 0.5);
          const mesh = new THREE.Mesh(sphereGeo, sphereMat);
          mesh.position.set(- sphereRadius - 1, sphereRadius + 2, i * sphereRadius * - 2.2);
          scene.add(mesh);
        }
      } 

      {
        
        const color = 0xFFFFFF; // 光颜色
        const intensity = 3; // 强度 
        const light = new THREE.DirectionalLight( color, intensity );
        // 光源位置
        light.position.set(0, 10, 0);
        // 光源目标位置
        light.target.position.set(-5, 0, 0);
        scene.add( light );
        scene.add(light.target);
      }


      // 判断渲染器的尺寸是否需要更新
      function resizeRendererToDisplaySize(renderer) {
        const canvas = renderer.domElement;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        // 检查渲染器的尺寸是否与画布的尺寸不同
        const needResize = canvas.width !== width || canvas.height !== height;
        if (needResize) {
          renderer.setSize(width, height, false);
        }
        return needResize;
      }


      // 动画实现
      function render(time){
        time *= 0.001; // convert time to seconds

        // 重新渲染 canvas 不变形
        if(resizeRendererToDisplaySize(renderer)){
          let canvas = renderer.domElement;
          camera.aspect = canvas.clientWidth / canvas.clientHeight;
          camera.updateProjectionMatrix();
        }

        renderer.render( scene, camera );

        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }

    main();
  </script>
</body>
</html>
