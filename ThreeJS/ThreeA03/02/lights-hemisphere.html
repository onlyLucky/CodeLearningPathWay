<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hemisphere Light</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/libs/three0.182.0/three.module.min.js",
        "three/addons/": "../../assets/libs/three0.182.0/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; // 引入视图控制器
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    function main(){
      const canvas = document.querySelector( '#c' );
      const renderer = new THREE.WebGLRenderer({antialias:true, canvas});

      const fov = 45;
      const aspect = 2; // the canvas default
      const near = 0.1;
      const far = 100;
      const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
      camera.position.set(0, 10, 20);

      // 创建轨道控制器，允许用户通过鼠标拖拽、滚轮缩放等方式交互浏览场景
      const controls = new OrbitControls( camera, canvas );
      // 设置控制器焦点为(0,5,0)，即相机环绕的中心点
      controls.target.set( 0, 5, 0 );
      // 应用控制器参数更新
      controls.update();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color( 'black' );

      {
        // 定义地面尺寸
        const planeSize = 40;
 
        // 创建纹理加载器并加载棋盘格纹理
        const loader = new THREE.TextureLoader();
        const texture = loader.load('../../assets/statics/images/checker.png');
        // 设置纹理在 S 方向（水平）重复
        texture.wrapS = THREE.RepeatWrapping;
        // 设置纹理在 T 方向（垂直）重复
        texture.wrapT = THREE.RepeatWrapping;
        // 使用最近邻过滤，避免纹理放大时模糊
        texture.magFilter = THREE.NearestFilter;
        // 设置纹理颜色空间为 sRGB
        texture.colorSpace = THREE.SRGBColorSpace;
        // 计算纹理重复次数，使每个格子大小为 2 单位
        const repeats = planeSize / 2;
        texture.repeat.set(repeats, repeats);

        // 创建平面几何体
        const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
        // 创建带纹理的 Phong 材质，双面渲染
        const planeMat = new THREE.MeshPhongMaterial({
          map: texture,
          side: THREE.DoubleSide,
        });
        // 创建地面网格
        const mesh = new THREE.Mesh(planeGeo, planeMat);
        // 将平面旋转至水平（绕 X 轴旋转 -90 度）
        mesh.rotation.x = Math.PI * -.5;
        // 将地面添加到场景
        scene.add(mesh);
      }

      {
        const cubeSize = 4;
        const cubeGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        const cubeMat = new THREE.MeshPhongMaterial({color: '#8AC'});
        const mesh = new THREE.Mesh(cubeGeo, cubeMat);
        mesh.position.set(cubeSize + 1, cubeSize / 2, 0);
        scene.add(mesh);
      }
      {
        const sphereRadius = 3;
        const sphereWidthDivisions = 32;
        const sphereHeightDivisions = 16;
        const sphereGeo = new THREE.SphereGeometry(sphereRadius, sphereWidthDivisions, sphereHeightDivisions);
        const sphereMat = new THREE.MeshPhongMaterial({color: '#CA8'});
        const mesh = new THREE.Mesh(sphereGeo, sphereMat);
        mesh.position.set(-sphereRadius - 1, sphereRadius + 2, 0);
        scene.add(mesh);
      }

      // 辅助类：用于将 Three.js 颜色对象与 lil-gui 的颜色控件绑定
      class ColorGUIHelper {
        constructor(object, prop) {
          this.object = object; // 保存目标对象（如光源）
          this.prop = prop;     // 保存需要绑定的颜色属性名（如 'color'）
        }
        // 读取时返回 #RRGGBB 格式的十六进制字符串
        get value() {
          return `#${this.object[this.prop].getHexString()}`;
        }
        // 写入时将十六进制字符串解析并设置回 Three.js 颜色对象
        set value(hexString) {
          this.object[this.prop].set(hexString);
        }
      }
      
      {
        
        const skyColor = 0xB1E1FF; // 天空颜色
        const groundColor = 0xB97A20; // 地面颜色
        const intensity = 1;
        // HemisphereLight 半球光，模拟天空和地面同时产生漫反射的环境光
        const light = new THREE.HemisphereLight( skyColor, groundColor, intensity );
        scene.add( light );

        const gui = new GUI();
        gui.addColor( new ColorGUIHelper( light, 'color' ), 'value' ).name( 'skyColor' );
        gui.addColor( new ColorGUIHelper( light, 'groundColor' ), 'value' ).name( 'groundColor' );
        gui.add( light, 'intensity', 0, 5, 0.01 );

      }
      

      // 判断渲染器的尺寸是否需要更新
      function resizeRendererToDisplaySize(renderer) {
        const canvas = renderer.domElement;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        // 检查渲染器的尺寸是否与画布的尺寸不同
        const needResize = canvas.width !== width || canvas.height !== height;
        if (needResize) {
          renderer.setSize(width, height, false);
        }
        return needResize;
      }


      // 动画实现
      function render(time){
        time *= 0.001; // convert time to seconds

        // 重新渲染 canvas 不变形
        if(resizeRendererToDisplaySize(renderer)){
          let canvas = renderer.domElement;
          camera.aspect = canvas.clientWidth / canvas.clientHeight;
          camera.updateProjectionMatrix();
        }

        renderer.render( scene, camera );

        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }

    main();
  </script>
</body>
</html>
