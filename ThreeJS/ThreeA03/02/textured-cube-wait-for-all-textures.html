<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textured Cube with Wait for All Textures</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loading .progress {
      margin: 1.5em;
      border: 1px solid white;
      width: 50vw;
    }
    #loading .progressbar {
      margin: 2px;
      background: white;
      height: 1em;
      transform-origin: top left;
      transform: scaleX(0);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loading">
    <div class="progress"><div class="progressbar"></div></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/libs/three0.182.0/three.module.min.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    function main(){
      const canvas = document.querySelector( '#c' );
      const renderer = new THREE.WebGLRenderer({antialias:true, canvas});

      const fov = 75;
      const aspect = 2; // the canvas default
      const near = 0.1;
      const far = 5;
      const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
      camera.position.z = 2;

      const scene = new THREE.Scene();

      const boxWidth = 1;
      const boxHeight = 1;
      const boxDepth = 1;
      const geometry = new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);

      // 创建数组用于存放所有立方体对象
      const cubes = []
      const loadManager = new THREE.LoadingManager();
      const loader = new THREE.TextureLoader(loadManager);

      function loadColorTexture(url){
        const texture = loader.load(url);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      // 加载所有需要的颜色纹理
      const materials = [
        // 前、后、左、右、上、下。 
        new THREE.MeshBasicMaterial({map: loadColorTexture('../../assets/statics/images/flower-1.jpg')}),
        new THREE.MeshBasicMaterial({map: loadColorTexture('../../assets/statics/images/flower-2.jpg')}),
        new THREE.MeshBasicMaterial({map: loadColorTexture('../../assets/statics/images/flower-3.jpg')}),
        new THREE.MeshBasicMaterial({map: loadColorTexture('../../assets/statics/images/flower-4.jpg')}),
        new THREE.MeshBasicMaterial({map: loadColorTexture('../../assets/statics/images/flower-5.jpg')}),
        new THREE.MeshBasicMaterial({map: loadColorTexture('../../assets/statics/images/flower-6.jpg')}),
      ];

      const loadingElem = document.querySelector('#loading');
      const progressBarElem = loadingElem.querySelector('.progressbar');

      loadManager.onLoad = function () {
        loadingElem.style.display = 'none';
        // 所有纹理加载完成后，创建并添加立方体到场景
        const cube = new THREE.Mesh( geometry, materials );
        scene.add(cube);
        // 将立方体加入数组以便后续动画控制
        cubes.push(cube);
      };

      loadManager.onProgress = function (urlOfLastItemLoaded, itemsLoaded, itemsTotal) {
        const progress = itemsLoaded / itemsTotal;
        progressBarElem.style.transform = `scaleX(${progress})`;
      };

      // 判断渲染器的尺寸是否需要更新
      function resizeRendererToDisplaySize(renderer) {
        const canvas = renderer.domElement;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        // 检查渲染器的尺寸是否与画布的尺寸不同
        const needResize = canvas.width !== width || canvas.height !== height;
        if (needResize) {
          renderer.setSize(width, height, false);
        }
        return needResize;
      }


      // 动画实现
      function render(time){
        time *= 0.001; // convert time to seconds

        // 重新渲染 canvas 不变形
        if(resizeRendererToDisplaySize(renderer)){
          let canvas = renderer.domElement;
          camera.aspect = canvas.clientWidth / canvas.clientHeight;
          camera.updateProjectionMatrix();
        }

        cubes.forEach((cube,index) => {
          const speed = .2 + index * .1;
          const rot = time * speed;
          cube.rotation.x = rot;
          cube.rotation.y = rot;
        });

        renderer.render( scene, camera );

        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }

    main();
  </script>
</body>
</html>
